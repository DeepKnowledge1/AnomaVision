name: CADMem one-time formatter

on:
  push:
    branches: [feature/cadmem-counterfactual-memory]
    paths:
      - .github/workflows/cadmem-autofmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cadmem-counterfactual-memory
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatters
        run: python -m pip install 'black==26.3.1' 'isort==8.0.1'
      - name: Format ONLY CADMem files
        run: |
          isort --profile black --line-length 88 anomavision/algorithm/cadmem tests/test_cadmem_research.py scripts/research/cadmem
          black --line-length 88 --target-version py310 anomavision/algorithm/cadmem tests/test_cadmem_research.py scripts/research/cadmem
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anomavision/algorithm/cadmem tests/test_cadmem_research.py scripts/research/cadmem
          if ! git diff --cached --quiet; then
            git commit -m "style(cadmem): apply black and isort to ablations"
            git push origin HEAD:feature/cadmem-counterfactual-memory
          fi
