name: Core Safety Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: core-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    name: Core Regression Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install CPU dependencies
        run: uv sync --extra cpu --locked

      - name: Run deterministic core contracts
        run: uv run pytest tests/test_core_safety_contract.py -q

  real-detect-regression:
    name: Real AnomaVision Detect Regression
    runs-on: ubuntu-latest
    needs: deterministic-contract

    steps:
      - name: Checkout repository with regression model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify regression assets
        shell: bash
        run: |
          test -s tests/regression/model/model.pt
          test -s tests/regression/images/good_01.png
          test -s tests/regression/images/defect_01.png
          test -s tests/regression/baseline.json
          echo "Regression assets present."

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install CPU dependencies
        run: uv sync --extra cpu --locked

      - name: Run real detect regression
        run: uv run python scripts/regression/run_detect_regression.py
