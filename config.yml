# =========================
# Dataset / preprocessing (shared by train, detect, eval, stream)
# =========================
dataset_path: "D:/01-DATA"
class_name: "bottle"
resize: [224, 224]
crop_size:
normalize: true
no_normalize: false
norm_mean: [0.485, 0.456, 0.406]
norm_std:  [0.229, 0.224, 0.225]

# =========================
# Model / training
# =========================
backbone: "resnet18"
algorithm: "efficientad"                       # padim | patchcore | efficientad
# Equivalent native selector:
# model:
#   name: padim

# PaDiM
feat_dim: 50
layer_indices: [0]

# PatchCore
coreset_ratio: 0.02
max_memory_patches: 2048
patch_grid: 14
search_chunk_size: 1024
coreset_method: "kcenter"
coreset_seed: 42

# EfficientAD
# EfficientAD uses ImageNet-normalized input and an EfficientNet-B0 teacher.
efficientad_model_size: "s"              # s | m
efficientad_lr: 0.0001
efficientad_weight_decay: 0.00001
efficientad_epochs: 1
efficientad_pretrained_teacher: true

model_data_path: "./distributions"
model: "model.pt"
output_model: "model.pt"
batch_size: 2
device: "auto"

# =========================
# Logging / run metadata
# =========================
log_level: "INFO"
run_name: "anomav_exp"
detailed_timing: false

# =========================
# Visualization
# =========================
enable_visualization: true
save_visualizations: true
viz_output_dir: "./visualizations/"
viz_alpha: 0.5
viz_padding: 40
viz_color: "128,0,128"

# =========================
# Inference
# =========================
img_path: "D:/01-DATA/test"
thresh: null
thresh_padim: 13.0
thresh_patchcore: 0.25
thresh_efficientad: null
num_workers: 1
pin_memory: false
overwrite: false

# =========================
# Evaluation
# =========================
memory_efficient: true

# =========================
# Export
# =========================
format: "all"
opset: 18
precision: "auto"
tensorrt_precision: "fp16"
dynamic_batch: true
static_batch: false
min_batch: 1
opt_batch: 1
max_batch: 4
workspace_gb: 2.0
calib_dir: null
calib_samples: 100
quantize_dynamic: false
quantize_static: false
optimize: false
output_path: null
half: false
int8: false

# =========================
# Streaming
# =========================
stream_mode: false
stream_source:
  type: "webcam"
  camera_id: 0
  video_path: "path/to/video.mp4"
  loop: false
  broker: "localhost"
  port: 1883
  topic: "camera/frames"
  client_id: null
  keepalive: 60
  qos: 0
  max_queue_size: 10
  read_timeout: 1.0
  host: "192.168.1.100"
  recv_timeout: 1.0
  header_size: 4
  max_message_size: 10485760
stream_max_frames: null
stream_display_fps: true
stream_save_detections: true
stream_detection_dir: "./stream_detections/"
