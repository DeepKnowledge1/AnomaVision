# =========================
# Dataset / preprocessing (shared by train, detect, eval, stream)
# =========================
dataset_path: "D:/01-DATA"
class_name: "bottle"
resize: [224, 224]
crop_size:
normalize: true
no_normalize: false
norm_mean: [0.485, 0.456, 0.406]
norm_std: [0.229, 0.224, 0.225]

# =========================
# Model / training
# =========================
backbone: "resnet18"
algorithm: "efficientad"
coreset_ratio: 0.02
max_memory_patches: 2048
patch_grid: 14
search_chunk_size: 1024
coreset_method: "kcenter"
coreset_seed: 42
feat_dim: 50
layer_indices: [0]
model_data_path: "./distributions"
model: "model.pt"
output_model: "model.pt"
batch_size: 2
device: "auto"

efficientad_epochs: 5
efficientad_learning_rate: 0.001
efficientad_threshold_percentile: 99.5

# =========================
# Inference performance tests
# =========================
inference_benchmark:
  enabled: true
  warmup_runs: 10
  test_runs: 50
  batch_size: 2
  max_inference_ms:
    padim: 100.0
    patchcore: 100.0
    efficientad: 150.0
  max_regression_percent: 25.0
  baseline_inference_ms:
    padim: null
    patchcore: null
    efficientad: 47.15

# =========================
# Logging / run metadata
# =========================
log_level: "INFO"
run_name: "anomav_exp"
detailed_timing: false

# =========================
# Visualization (detect/eval)
# =========================
enable_visualization: true
save_visualizations: true
viz_output_dir: "./visualizations/"
viz_alpha: 0.5
viz_padding: 40
viz_color: "128,0,128"

# =========================
# Inference (detect)
# =========================
img_path: "D:/01-DATA/test"
thresh: null
thresh_padim: 13.0
thresh_patchcore: 0.25
thresh_efficientad: 1.0
num_workers: 1
pin_memory: false
overwrite: false

# =========================
# Industrial Actions / PLC Integration
# =========================
# Explicitly disabled by default. Normal AnomaVision inference never connects
# to MQTT, OPC UA, or other external systems unless this is set to true.
actions_enabled: false

# If true, a configured action failure stops inference. Default is false.
actions_fail_fast: false

# Configure actions here. They are ignored while actions_enabled is false.
actions: []

# Example MQTT action:
# actions:
#   - type: mqtt
#     broker: "localhost"
#     port: 1883
#     topic: "factory/anomavision/results"
#     client_id: "anomavision"
#     keepalive: 60
#     qos: 1
#     retain: false

# Example evidence action:
# actions:
#   - type: evidence
#     directory: "./evidence"
#     save_pass: false
#     save_fail: true
#     save_unknown: true

# Example OPC UA action:
# actions:
#   - type: opcua
#     endpoint: "opc.tcp://192.168.1.100:4840"
#     decision_node: "ns=2;s=AnomaVision.Decision"
#     score_node: "ns=2;s=AnomaVision.AnomalyScore"
#     timeout: 5.0

# =========================
# Evaluation (eval)
# =========================
memory_efficient: true

# =========================
# Export (export)
# =========================
format: "all"
opset: 18
precision: "auto"
tensorrt_precision: "fp16"
dynamic_batch: true
static_batch: false
min_batch: 1
opt_batch: 1
max_batch: 4
workspace_gb: 2.0
calib_dir: null
calib_samples: 100
quantize_dynamic: false
quantize_static: false
optimize: false
output_path: null
half: false
int8: false

# =========================
# Streaming
# =========================
stream_mode: false
stream_source:
  type: "webcam"
  camera_id: 0
  video_path: "path/to/video.mp4"
  loop: false
  broker: "localhost"
  port: 1883
  topic: "camera/frames"
  client_id: null
  keepalive: 60
  qos: 0
  max_queue_size: 10
  read_timeout: 1.0
  host: "192.168.1.100"
  recv_timeout: 1.0
  header_size: 4
  max_message_size: 10485760
stream_max_frames: null
stream_display_fps: true
stream_save_detections: true
stream_detection_dir: "./stream_detections/"
